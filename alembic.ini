# Alembic-Konfiguration fuer Finanzuebersicht (T-028, N-DB-01/N-DB-03).
#
# Die Datenbank-URL steht bewusst NICHT hier: env.py liest sie aus den
# Projekt-Settings (DATABASE_URL bzw. Ableitung aus DATA_DIR, siehe
# backend/finue/config.py), damit es nur eine Quelle gibt und keine Zugangsdaten
# in dieser Datei landen.

[alembic]
# Pfad zum Migrationsverzeichnis, relativ zu dieser Datei.
script_location = %(here)s/backend/finue/migrations

# Backend-Verzeichnis auf sys.path legen, damit "finue" auch ohne
# Installation importierbar ist.
prepend_sys_path = %(here)s/backend

# Trenner fuer prepend_sys_path / version_locations: os = plattformabhaengig
# (Windows: ";"). Beide Schluessel setzen, sonst warnt Alembic.
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
